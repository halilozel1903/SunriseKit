name: SunriseKitDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  SunriseKit:
    path: ..
targets:
  DaybreakWatch:
    # A standalone (watch-only) app: one application target built with the watchOS SDK, no iOS companion.
    type: application
    platform: watchOS
    sources:
      - Shared
      - Watch
    dependencies:
      - package: SunriseKit
        product: SunriseKit
      - package: SunriseKit
        product: SunriseUI
    info:
      path: DaybreakWatch-Info.plist
      properties:
        CFBundleDisplayName: Daybreak
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: Daybreak shows sunrise, sunset and golden hour where you are.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.DaybreakWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daybreak
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Daybreak shows sunrise, sunset and golden hour where you are.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
  DaybreakPhone:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone
    dependencies:
      - package: SunriseKit
        product: SunriseKit
      - package: SunriseKit
        product: SunriseUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.DaybreakPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daybreak
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Daybreak shows sunrise, sunset and golden hour where you are.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  DaybreakWatch:
    build:
      targets:
        DaybreakWatch: all
    run:
      config: Debug
  DaybreakPhone:
    build:
      targets:
        DaybreakPhone: all
    run:
      config: Debug
