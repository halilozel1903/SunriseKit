    <rect x="262" y="320" width="150" height="44" rx="22" fill="#5B8CFF" fill-opacity="0.18" stroke="#5B8CFF" stroke-opacity="0.6"/>
    <text x="337" y="349" text-anchor="middle" fill="#A9C2FF">Blue hour</text>
    <rect x="424" y="320" width="186" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.3"/>
    <text x="517" y="349" text-anchor="middle" fill="#ECEAFB">3 twilights</text>
    <rect x="74" y="378" width="196" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.3"/>
