    <rect x="494" y="378" width="176" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.3"/>
    <text x="582" y="407" text-anchor="middle" fill="#ECEAFB">Polar days</text>
  </g>
  <text x="74" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#B9B4DA">watchOS 10 · iOS 17 · Swift 6.2 · No API key</text>

