  <text x="74" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#D9D6F2">Sunrise, sunset, twilight and golden hour</text>
  <text x="74" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#D9D6F2">for Apple Watch and iPhone, in Swift.</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
