      <rect x="32" y="388" width="186" height="8" rx="4" fill="#121838"/><rect x="90" y="388" width="70" height="8" rx="4" fill="#FFC94D"/>
      <rect x="32" y="412" width="186" height="8" rx="4" fill="#121838"/><rect x="92" y="412" width="66" height="8" rx="4" fill="#FFC94D"/>
      <rect x="32" y="436" width="186" height="8" rx="4" fill="#121838"/><rect x="94" y="436" width="62" height="8" rx="4" fill="#FFC94D"/>
      <rect x="32" y="460" width="186" height="8" rx="4" fill="#121838"/><rect x="96" y="460" width="58" height="8" rx="4" fill="#FFC94D"/>
